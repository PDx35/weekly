version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | grep -e S3_REGION -e S3_BUCKET_NAME -e S3_ACCESS_KEY_ID -e S3_SECRET_ACCESS_KEY -e FIREBASE_ADMIN_PROJECT_ID -e FIREBASE_ADMIN_CLIENT_EMAIL -e FIREBASE_ADMIN_PRIVATE_KEY -e NEXT_PUBLIC_FIREBASE_API_KEY -e NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN -e NEXT_PUBLIC_FIREBASE_PROJECT_ID -e NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET -e NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID -e NEXT_PUBLIC_FIREBASE_APP_ID -e NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID -e NEXT_PUBLIC_RAZORPAY_KEY_ID -e RAZORPAY_KEY_SECRET -e RAZORPAY_WEBHOOK_SECRET -e ADMIN_SETUP_SECRET >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
